<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="480" fill="url(#bg)"/>
  <ellipse cx="160" cy="420" rx="120" ry="16" fill="#38bdf8" fill-opacity="0.08"/>
  <!-- hoodie -->
  <path d="M70 280 Q60 380 55 440 L265 440 Q260 380 250 280 Q160 240 70 280Z" fill="#1e3a5f" stroke="#334155" stroke-width="2"/>
  <ellipse cx="160" cy="210" rx="62" ry="70" fill="#fcd9c4"/>
  <!-- hair -->
  <path d="M98 175 Q160 120 222 175 Q235 200 228 230 Q160 200 92 230 Q85 200 98 175Z" fill="#3f2e24"/>
  <!-- eyes -->
  <ellipse cx="138" cy="205" rx="8" ry="10" fill="#1e293b"/>
  <ellipse cx="182" cy="205" rx="8" ry="10" fill="#1e293b"/>
  <!-- laptop -->
  <rect x="85" y="330" width="150" height="95" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="95" y="340" width="130" height="70" rx="2" fill="url(#screen)" filter="url(#glow)" opacity="0.9"/>
  <text x="160" y="382" text-anchor="middle" fill="#020617" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">console.log</text>
  <rect x="70" y="420" width="180" height="12" rx="2" fill="#334155"/>
  <!-- hoodie pocket -->
  <path d="M120 300 L200 300 L195 340 L125 340Z" fill="#172554" opacity="0.7"/>
</svg>
