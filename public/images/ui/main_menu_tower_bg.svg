<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="rack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="520" fill="url(#glow)"/>
  <!-- abstract "release train" skyline  server blocks / CI glow -->
  <g opacity="0.85">
    <rect x="120" y="420" width="140" height="320" rx="4" fill="url(#rack)" stroke="#334155" stroke-width="2"/>
    <rect x="135" y="440" width="110" height="12" rx="2" fill="#22d3ee" fill-opacity="0.35"/>
    <rect x="135" y="465" width="90" height="8" rx="1" fill="#64748b"/>
    <rect x="135" y="485" width="100" height="8" rx="1" fill="#64748b"/>
    <rect x="135" y="505" width="70" height="8" rx="1" fill="#64748b"/>
    <rect x="280" y="380" width="160" height="360" rx="4" fill="url(#rack)" stroke="#334155" stroke-width="2"/>
    <rect x="298" y="400" width="125" height="14" rx="2" fill="#38bdf8" fill-opacity="0.4"/>
    <rect x="298" y="430" width="95" height="9" fill="#475569"/>
    <rect x="298" y="450" width="110" height="9" fill="#475569"/>
    <rect x="450" y="520" width="120" height="220" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="600" y="300" width="200" height="440" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="620" y="325" width="160" height="18" rx="2" fill="#38bdf8" fill-opacity="0.45"/>
    <rect x="620" y="360" width="130" height="10" fill="#475569"/>
    <rect x="620" y="385" width="140" height="10" fill="#475569"/>
    <rect x="620" y="410" width="100" height="10" fill="#475569"/>
    <rect x="820" y="450" width="180" height="290" rx="4" fill="url(#rack)" stroke="#334155"/>
    <rect x="1020" y="360" width="170" height="380" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="1220" y="480" width="150" height="260" rx="4" fill="#0f172a" stroke="#475569"/>
    <rect x="1400" y="400" width="190" height="340" rx="4" fill="url(#rack)" stroke="#334155"/>
    <rect x="1620" y="340" width="160" height="400" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.25"/>
    <rect x="1640" y="365" width="125" height="16" rx="2" fill="#22d3ee" fill-opacity="0.3"/>
  </g>
  <!-- faint code mist -->
  <text x="960" y="200" text-anchor="middle" fill="#38bdf8" fill-opacity="0.07" font-family="ui-monospace, monospace" font-size="22">git push origin main  deploy  ship</text>
  <text x="960" y="240" text-anchor="middle" fill="#94a3b8" fill-opacity="0.06" font-family="ui-monospace, monospace" font-size="18">const release = () =&gt; uptime;</text>
</svg>
